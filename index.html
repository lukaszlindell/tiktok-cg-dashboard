<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TikTok Community Guidelines Enforcement Dashboard</title>
  <script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.7.1/dist/chart.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --ink: #16202a;
      --muted: #64727f;
      --line: #dfe5ea;
      --panel: #ffffff;
      --page: #f4f7f8;
      --nav: #111820;
      --nav-soft: #1c2732;
      --accent: #00a19a;
      --accent-2: #ff4d67;
      --amber: #f7b731;
      --shadow: 0 16px 40px rgba(22, 32, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--page);
      color: var(--ink);
    }

    button, input, select {
      font: inherit;
    }

    .app-shell {
      display: grid;
      grid-template-columns: minmax(280px, 340px) 1fr;
      min-height: 100vh;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: var(--nav);
      color: #f6fbfb;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
    }

    .brand {
      padding: 28px 24px 22px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: #8ce5df;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(1.55rem, 3vw, 2.25rem);
      line-height: 1.03;
      letter-spacing: 0;
    }

    .brand p {
      margin: 14px 0 0;
      color: #b8c6cf;
      font-size: 0.94rem;
      line-height: 1.5;
    }

    .period-card {
      margin-top: 18px;
      padding: 12px;
      border: 1px solid rgba(140, 229, 223, 0.28);
      border-radius: 8px;
      background: rgba(0, 161, 154, 0.12);
    }

    .period-label {
      display: block;
      margin-bottom: 4px;
      color: #8ce5df;
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .period-value {
      display: block;
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 850;
      line-height: 1.25;
    }

    .controls {
      display: grid;
      gap: 14px;
      padding: 18px 18px 16px;
      background: var(--nav-soft);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .control label {
      display: block;
      margin-bottom: 7px;
      color: #b8c6cf;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .control input,
    .control select {
      width: 100%;
      min-height: 42px;
      padding: 10px 12px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      background: #0e151c;
      color: #ffffff;
      outline: none;
    }

    .control input:focus,
    .control select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0, 161, 154, 0.22);
    }

    .policy-panel {
      min-height: 0;
      overflow-y: auto;
      padding: 16px 12px 22px;
    }

    .panel-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      padding: 0 8px 10px;
    }

    .panel-heading h2 {
      margin: 0;
      font-size: 0.88rem;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .count-pill {
      min-width: 32px;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.09);
      color: #c5d1d8;
      font-size: 0.75rem;
      text-align: center;
    }

    .policy-list {
      display: grid;
      gap: 6px;
    }

    .policy-item {
      display: grid;
      grid-template-columns: 5px 1fr;
      gap: 10px;
      width: 100%;
      min-height: 52px;
      padding: 11px 10px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #dbe5eb;
      text-align: left;
      cursor: pointer;
    }

    .policy-item.parent {
      min-height: 58px;
    }

    .policy-item::before {
      content: "";
      width: 5px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.14);
    }

    .policy-item:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .policy-item.active {
      background: #ffffff;
      color: var(--ink);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
    }

    .policy-item.active::before {
      background: var(--accent-2);
    }

    .policy-name {
      display: block;
      overflow-wrap: anywhere;
      font-size: 0.92rem;
      font-weight: 700;
      line-height: 1.25;
    }

    .policy-category {
      display: block;
      margin-top: 4px;
      color: inherit;
      opacity: 0.62;
      font-size: 0.76rem;
      line-height: 1.25;
    }

    .subpolicy-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 24px;
      margin-left: 8px;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.11);
      color: inherit;
      font-size: 0.72rem;
      font-weight: 800;
    }

    .content {
      min-width: 0;
      padding: 28px;
      overflow: auto;
    }

    .report-strip {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin: -28px -28px 24px;
      padding: 12px 28px;
      border-bottom: 1px solid var(--line);
      background: rgba(244, 247, 248, 0.94);
      backdrop-filter: blur(12px);
    }

    .report-strip strong {
      color: var(--ink);
      font-size: 0.9rem;
    }

    .report-strip span {
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 700;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }

    .topbar h2 {
      margin: 0;
      max-width: 860px;
      font-size: clamp(1.7rem, 3.4vw, 3rem);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .topbar p {
      max-width: 720px;
      margin: 10px 0 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .region-badge {
      flex: 0 0 auto;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 800;
    }

    .subpolicy-selector {
      margin-bottom: 18px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      position: relative;
      overflow: visible;
    }

    .subpolicy-selector-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .subpolicy-selector-header h3 {
      margin: 0;
      font-size: 1.08rem;
    }

    .subpolicy-selector-header span {
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 800;
    }

    .subpolicy-tabs {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .subpolicy-tab {
      display: grid;
      gap: 4px;
      min-height: 72px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f8fafb;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
    }

    .subpolicy-tab strong {
      font-size: 0.95rem;
      line-height: 1.2;
    }

    .subpolicy-tab span {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 800;
    }

    .subpolicy-tab:hover {
      border-color: rgba(0, 161, 154, 0.45);
      background: #f0fbfa;
    }

    .subpolicy-tab.active {
      border-color: var(--accent);
      background: var(--accent);
      color: #ffffff;
    }

    .subpolicy-tab.active span {
      color: rgba(255, 255, 255, 0.78);
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }

    .metric-card,
    .note-card,
    .comparison-card,
    .empty-state {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .metric-card {
      min-height: 112px;
      padding: 16px;
    }

    .card-label {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .card-value {
      margin: 0;
      font-size: clamp(1.45rem, 2.5vw, 2.2rem);
      font-weight: 850;
      letter-spacing: 0;
      line-height: 1.06;
    }

    .card-detail {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.35;
    }

    .metric-card strong {
      display: block;
      margin-top: 2px;
      color: var(--ink);
      font-size: 1.55rem;
      line-height: 1.1;
    }

    .metric-card.accent {
      border-color: rgba(0, 161, 154, 0.34);
      background: linear-gradient(180deg, #ffffff 0%, #effbf9 100%);
    }

    .metric-card.warning {
      border-color: rgba(247, 183, 49, 0.42);
      background: linear-gradient(180deg, #ffffff 0%, #fff8e8 100%);
    }

    .note-card h3,
    .comparison-card h3 {
      margin: 0 0 6px;
      font-size: 1rem;
    }

    .note-card p,
    .comparison-card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.45;
    }

    .note-card {
      padding: 18px;
    }

    .comparison-card {
      min-width: 0;
      padding: 18px;
    }

    .comparison-table {
      display: grid;
      gap: 8px;
      margin-top: 16px;
    }

    .comparison-row {
      display: grid;
      grid-template-columns: auto minmax(180px, 1.25fr) repeat(3, minmax(90px, 0.55fr));
      gap: 10px;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f8fafb;
    }

    .comparison-row.header {
      background: #eef3f5;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .comparison-copy {
      min-height: 32px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font-size: 0.78rem;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    .comparison-copy:hover {
      border-color: rgba(0, 161, 154, 0.45);
      background: #f0fbfa;
    }

    .comparison-clipboard-banner {
      margin-top: 12px;
      padding: 10px 12px;
      border: 1px solid rgba(0, 161, 154, 0.28);
      border-radius: 8px;
      background: #f0fbfa;
      color: #126b66;
      font-size: 0.84rem;
      font-weight: 800;
    }

    .copy-toast {
      position: fixed;
      left: 50%;
      bottom: 20px;
      z-index: 40;
      transform: translateX(-50%);
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(17, 24, 32, 0.94);
      color: #fff;
      font-size: 0.85rem;
      font-weight: 800;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.22);
      pointer-events: none;
    }

    .auth-screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at top, #f7fbfb 0%, #eef4f5 46%, #e8eff1 100%);
    }

    .auth-card {
      width: min(420px, 100%);
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-shadow: var(--shadow);
    }

    .auth-card h2 {
      margin: 0;
      font-size: 1.6rem;
      line-height: 1.15;
    }

    .auth-card p {
      margin: 10px 0 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .auth-form {
      display: grid;
      gap: 14px;
      margin-top: 20px;
    }

    .auth-field label {
      display: block;
      margin-bottom: 7px;
      color: var(--ink);
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .auth-field input[type="password"] {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: none;
    }

    .auth-field input[type="password"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0, 161, 154, 0.18);
    }

    .auth-remember {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--ink);
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
    }

    .auth-remember input {
      width: 16px;
      height: 16px;
      margin: 0;
    }

    .auth-submit {
      min-height: 44px;
      border: 1px solid var(--accent);
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-weight: 800;
      cursor: pointer;
    }

    .auth-error {
      margin: 0;
      color: #a3263a;
      font-size: 0.88rem;
      font-weight: 700;
    }

    .comparison-name {
      color: var(--ink);
      font-weight: 850;
      line-height: 1.25;
    }

    .comparison-value {
      color: var(--ink);
      font-weight: 800;
      text-align: right;
    }

    .policy-preview {
      position: absolute;
      z-index: 12;
      width: min(220px, calc(100% - 24px));
      max-height: min(280px, 60vh);
      overflow: hidden;
      border: 1px solid rgba(22, 32, 42, 0.12);
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.22);
      display: grid;
      grid-template-rows: auto 1fr auto;
      pointer-events: auto;
    }

    .policy-preview-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 10px 8px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #ffffff 0%, #f8fafb 100%);
    }

    .policy-preview-kicker {
      margin: 0 0 4px;
      color: var(--muted);
      font-size: 0.68rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .policy-preview-header h3 {
      margin: 0;
      font-size: 0.88rem;
      line-height: 1.22;
    }

    .policy-preview-close {
      min-height: 28px;
      padding: 0 9px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font-weight: 700;
      cursor: pointer;
    }

    .policy-preview-body {
      display: grid;
      gap: 8px;
      padding: 10px;
      overflow: auto;
    }

    .policy-preview-summary {
      margin: 0;
      color: var(--ink);
      font-size: 0.82rem;
      line-height: 1.42;
    }

    .policy-preview-scroll {
      display: grid;
      gap: 8px;
      max-height: 150px;
      overflow: auto;
      padding-right: 4px;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.45;
    }

    .policy-preview-actions {
      display: flex;
      justify-content: flex-end;
      padding: 0 10px 10px;
    }

    .policy-preview-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 30px;
      padding: 0 10px;
      border-radius: 8px;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      font-size: 0.78rem;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
    }

    .empty-state {
      display: grid;
      min-height: 420px;
      place-items: center;
      padding: 34px;
      text-align: center;
    }

    .empty-state h2 {
      margin: 0 0 10px;
      font-size: 2rem;
    }

    .empty-state p {
      max-width: 520px;
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
    }

    @media (max-width: 760px) {
      .app-shell {
        grid-template-columns: 1fr;
      }

      .sidebar {
        min-height: auto;
      }

      .policy-panel {
        max-height: 340px;
      }

      .content {
        padding: 22px;
      }

      .report-strip {
        margin: -22px -22px 22px;
        padding: 12px 22px;
      }

      .topbar {
        flex-direction: column;
      }

      .metric-grid {
        grid-template-columns: 1fr;
      }

      .subpolicy-tabs {
        grid-template-columns: 1fr;
      }

      .comparison-row {
        grid-template-columns: 1fr;
      }

      .comparison-row.header {
        display: none;
      }

      .comparison-copy {
        justify-self: start;
      }

      .comparison-value {
        text-align: left;
      }
    }

    @media (min-width: 761px) and (max-width: 1100px) {
      .app-shell {
        grid-template-columns: minmax(280px, 320px) minmax(0, 1fr);
      }

      .content {
        padding: 22px;
      }

      .report-strip {
        margin: -22px -22px 22px;
        padding: 12px 22px;
      }

      .metric-grid {
        grid-template-columns: 1fr;
      }

      .subpolicy-tabs {
        grid-template-columns: 1fr;
      }

      .comparison-row {
        grid-template-columns: auto 1fr 1fr 1fr;
      }

      .comparison-name {
        grid-column: 2 / -1;
      }
    }

    @media (max-width: 560px) {
      .brand,
      .content {
        padding: 18px;
      }

      .controls {
        padding: 14px;
      }

      .report-strip {
        align-items: flex-start;
        flex-direction: column;
      }

    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const AUTH_PASSWORD = 'safety';
    const AUTH_STORAGE_KEY = 'cg-dashboard-auth';
    const QUARTER_OPTIONS = [
      {
        id: '2025Q4',
        label: 'Q4 2025',
        period: 'Oct-Dec 2025',
        dataUrl: 'data.json',
        regionUrl: 'region_policy_metrics.json'
      },
      {
        id: '2025Q1',
        label: 'Q1 2025',
        period: 'Jan-Mar 2025',
        dataUrl: 'data-2025Q1.json',
        regionUrl: 'region_policy_metrics-2025Q1.json'
      }
    ];
    const OFFICIAL_PARENT_POLICIES = [
      'Integrity and Authenticity',
      'Mental and Behavioral Health',
      'Privacy and Security',
      'Regulated Goods, Services, and Commercial Activities',
      'Safety and Civility',
      'Sensitive and Mature Themes',
      'Youth Safety and Well-Being'
    ];
    const POLICY_PARENT_OVERRIDES = {
      Misinformation: 'Integrity and Authenticity'
    };

    const POLICY_REFERENCE = {
      'Integrity and Authenticity': {
        url: 'https://www.tiktok.com/community-guidelines/en/integrity-authenticity/',

      'Civic and Election Integrity': {

      'Edited Media and AI-Generated Content (AIGC)': {

      },
      'Fake Engagement': {

      },
      'Deceptive Behaviors and Fake Engagement': {
        url: 'https://www.tiktok.com/community-guidelines/en/integrity-authenticity/',
        summary: 'TikTok does not allow fake engagement or deceptive behavior that tries to manipulate attention, views, or account activity.'
      },
      'Spam and Deceptive Behavior': {
        url: 'https://www.tiktok.com/community-guidelines/en/integrity-authenticity/',
        summary: 'TikTok does not allow spam or deceptive behavior that manipulates users, attention, or platform activity.'
      },
      'Unoriginal Content': {
        url: 'https://www.tiktok.com/community-guidelines/en/integrity-authenticity/',
        summary: 'TikTok expects creators to post their own work or content they have the right to share. Reused content without meaningful original changes can be removed or kept out of recommendation surfaces.'
      },

    function quarterLabel(quarter) {
      return quarter.label + ' (' + quarter.period + ')';

    function policyReference(policy, parent) {
      const candidates = [
        parent && policy.includes(' - ') ? policy : (parent ? parent + ' - ' + shortPolicyName(policy) : null),
        policy,
        policy.replace(/ & /g, ' and '),
        shortPolicyName(policy),
        shortPolicyName(policy).replace(/ & /g, ' and ')
      ];

      for (const key of candidates) {
        if (POLICY_REFERENCE[key]) return POLICY_REFERENCE[key];
      }

      return {
        url: 'https://www.tiktok.com/community-guidelines/en/',
        summary: 'Open TikTok’s Community Guidelines overview to inspect the full policy text for this item.'
      };
    }

    async function loadDashboardData(quarterId) {
      const quarter = QUARTER_OPTIONS.find(item => item.id === quarterId) || QUARTER_OPTIONS[0];
      const [globalRes, regionRes] = await Promise.all([
        fetch(quarter.dataUrl).then(r => r.json()),
        fetch(quarter.regionUrl).then(r => r.json())
      ]);
      return { quarter, globalData: globalRes, regionData: regionRes };
    }

    function shortPolicyName(policy) {
      return policy.includes(' - ') ? policy.split(' - ').slice(1).join(' - ') : policy;
    }

    function policyCategory(policy) {
      if (POLICY_PARENT_OVERRIDES[policy]) return POLICY_PARENT_OVERRIDES[policy];
      return policy.includes(' - ') ? policy.split(' - ')[0] : policy;
    }

    function parentPolicyName(policy) {
      return policyCategory(policy);
    }

    function buildPolicyGroups(policies) {
      const groups = new Map();
      policies.forEach(policy => {
        const parent = parentPolicyName(policy);
        if (!groups.has(parent)) {
          groups.set(parent, { parent, parentPolicy: null, subPolicies: [] });
        }
        const group = groups.get(parent);
        if (policy === parent) {
          group.parentPolicy = policy;
        } else {
          group.subPolicies.push(policy);
        }
      });

      return Array.from(groups.values()).map(group => ({
        ...group,
        subPolicies: group.subPolicies.sort()
      })).sort((a, b) => {
        const aIndex = OFFICIAL_PARENT_POLICIES.indexOf(a.parent);
        const bIndex = OFFICIAL_PARENT_POLICIES.indexOf(b.parent);
        if (aIndex !== -1 && bIndex !== -1) return aIndex - bIndex;
        if (aIndex !== -1) return -1;
        if (bIndex !== -1) return 1;
        return a.parent.localeCompare(b.parent);
      });
    }

    function formatLargeNumber(value) {
      if (value === undefined || value === null || Number.isNaN(value)) return 'N/A';
      const absolute = Math.abs(value);
      if (absolute >= 1000000000) return (value / 1000000000).toFixed(1).replace('.0', '') + 'B';
      if (absolute >= 1000000) return (value / 1000000).toFixed(1).replace('.0', '') + 'M';
      if (absolute >= 1000) return (value / 1000).toFixed(1).replace('.0', '') + 'K';
      return Math.round(value).toLocaleString();
    }

    function formatPercent(value) {
      if (value === undefined || value === null || Number.isNaN(value)) return 'N/A';
      return value.toFixed(1).replace('.0', '') + '%';
    }

    function quarterClipboardLabel(quarter) {
      const label = quarter && quarter.label ? quarter.label : '';
      const match = label.match(/^(Q\d)\s+(\d{4})$/);
      if (match) return { quarter: match[1], year: match[2] };
      return { quarter: label || 'QX', year: 'YYYY' };
    }

    async function copyTextToClipboard(text) {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch (error) {
        // Fall through to the legacy path below.
      }

      try {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.setAttribute('readonly', '');
        textarea.style.position = 'fixed';
        textarea.style.left = '-9999px';
        textarea.style.top = '0';
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        textarea.setSelectionRange(0, textarea.value.length);
        const copied = document.execCommand('copy');
        document.body.removeChild(textarea);
        return copied;
      } catch (error) {
        return false;
      }
    }

      React.useEffect(() => {
        const sessionValue = window.sessionStorage.getItem(AUTH_STORAGE_KEY);

        if (!isUnlocked) return;

      const regionOptions = React.useMemo(() => {

        if (!regionOptions.includes(selectedRegion)) {
          setSelectedRegion('Global');

      const selectedQuarter = data.quarter || QUARTER_OPTIONS[0];
      const reportingPeriod = quarterLabel(selectedQuarter);
      const clipboardQuarter = quarterClipboardLabel(selectedQuarter);

      const policyList = React.useMemo(() => {
        if (selectedRegion === 'Global') return data.globalData.map(item => item.policy);
        return Object.keys(data.regionData[selectedRegion] || {}).sort();
      }, [data, selectedRegion]);

      const filteredPolicies = React.useMemo(() => {
        const needle = query.trim().toLowerCase();
        if (!needle) return policyList;
        return policyList.filter(policy => policy.toLowerCase().includes(needle));
      }, [policyList, query]);

      const policyGroups = React.useMemo(() => {
        return buildPolicyGroups(filteredPolicies);

          window.clearTimeout(hidePreviewTimer.current);
          hidePreviewTimer.current = null;
        }
      }

      function hidePolicyPreview() {
        clearPreviewTimer();
        setPolicyPreview(null);
      }

      function scheduleHidePolicyPreview() {
        clearPreviewTimer();
        hidePreviewTimer.current = window.setTimeout(() => {
          setPolicyPreview(null);
        }, 120);
      }

      function showPolicyPreview(policy, parent, anchorEl) {
        clearPreviewTimer();
        const container = selectorRef.current;
        if (!container || !anchorEl) {
          setPolicyPreview({ policy, parent, top: 18, left: 18 });
          return;
        }

        const containerRect = container.getBoundingClientRect();
        const anchorRect = anchorEl.getBoundingClientRect();
        const previewWidth = Math.max(220, Math.min(430, containerRect.width - 24));
        const left = Math.max(12, Math.min(
          anchorRect.left - containerRect.left,
          Math.max(12, containerRect.width - previewWidth - 12)
        ));
        const top = Math.max(12, anchorRect.bottom - containerRect.top + 12);
        setPolicyPreview({ policy, parent, top, left });
      }

      React.useEffect(() => {
        const firstGroup = policyGroups[0];
        if (!firstGroup) {

          setSelectedPolicy('');
          hidePolicyPreview();
          return;
        }

        const parentStillVisible = policyGroups.some(group => group.parent === selectedParent);
        if (!parentStillVisible) {
          const nextPolicy = firstGroup.parentPolicy || firstGroup.subPolicies[0] || '';
          setSelectedParent(firstGroup.parent);
          setSelectedPolicy(nextPolicy);
          hidePolicyPreview();
          return;
        }

        const visiblePolicies = policyGroups.flatMap(group =>
          [group.parentPolicy].concat(group.subPolicies).filter(Boolean)
        );
        if (!visiblePolicies.includes(selectedPolicy)) {
          const group = policyGroups.find(item => item.parent === selectedParent) || firstGroup;
          setSelectedPolicy(group.parentPolicy || group.subPolicies[0] || '');
          hidePolicyPreview();
        }
      }, [policyGroups, selectedParent, selectedPolicy]);

      React.useEffect(() => {
        return () => clearPreviewTimer();
      }, []);

      React.useEffect(() => {
        hidePolicyPreview();
      }, [selectedParent, selectedRegion, query]);

      const metrics = React.useMemo(() => {
        if (!selectedPolicy) return null;
        if (selectedRegion === 'Global') {
          const item = data.globalData.find(p => p.policy === selectedPolicy);
          if (!item) return null;
          return {
            videos_removed: item.videos_removed,
            videos_removed_proactive: item.videos_removed_proactive,
            proactive_rate: item.proactive_rate,
            before_views: item.before_views,
            within_24h: item.within_24h,
            accounts_removed: item.accounts_banned,
            comments_removed: item.comments_removed,
            note: item.suggested_response
          };
        }

        const m = (data.regionData[selectedRegion] || {})[selectedPolicy];
        if (!m) return null;
        return {
          videos_removed: m['Total videos removed'],
          comments_removed: m['Comments removed'],
          accounts_removed: m['Accounts removed'],
          proactive_rate: normalizeRegionalRate(m['Proactive removal rate']),
          before_views: normalizeRegionalRate(m['Removal rate before any views']),
          within_24h: normalizeRegionalRate(m['Removal rate within 24 hours'])
        };
      }, [selectedPolicy, selectedRegion, data]);

      const comparisonRows = React.useMemo(() => {
        if (!selectedGroup) return [];
        const source = selectedRegion === 'Global'
          ? Object.fromEntries(data.globalData.map(item => [item.policy, item]))
          : data.regionData[selectedRegion] || {};
        return selectedGroup.subPolicies.map(policy => {
          const item = source[policy];
          if (!item) return null;
          const rowMetrics = selectedRegion === 'Global' ? {
            proactive_rate: item.proactive_rate,
            within_24h: item.within_24h,
            before_views: item.before_views
          } : {
            proactive_rate: normalizeRegionalRate(item['Proactive removal rate']),
            within_24h: normalizeRegionalRate(item['Removal rate within 24 hours']),
            before_views: normalizeRegionalRate(item['Removal rate before any views'])
          };
          return { policy, metrics: rowMetrics };
        }).filter(Boolean);
      }, [selectedGroup, selectedRegion, data]);

      function handleCopySubPolicy(row) {
        const text = `In ${clipboardQuarter.quarter} of ${clipboardQuarter.year}, of the videos removed due to violation of this policy, ${formatPercent(row.metrics.proactive_rate)} were removed by us proactively without having been reported. ${formatPercent(row.metrics.before_views)} were removed before any views and ${formatPercent(row.metrics.within_24h)} were removed within 24 hours.`;
        copyTextToClipboard(text).then(success => {
          if (!success) return;
          setClipboardStatus(row.policy);
          setCopyToast('Copied!');
          if (clipboardTimer.current) window.clearTimeout(clipboardTimer.current);
          clipboardTimer.current = window.setTimeout(() => setClipboardStatus(null), 1800);
          if (toastTimer.current) window.clearTimeout(toastTimer.current);
          toastTimer.current = window.setTimeout(() => setCopyToast(''), 900);
        });
      }

      function handleUnlock(remember) {
        window.sessionStorage.removeItem(AUTH_STORAGE_KEY);
        window.localStorage.removeItem(AUTH_STORAGE_KEY);
        if (remember) {
          window.localStorage.setItem(AUTH_STORAGE_KEY, '1');
        } else {
          window.sessionStorage.setItem(AUTH_STORAGE_KEY, '1');
        }
        setIsUnlocked(true);
      }

      if (!isUnlocked) {
        return React.createElement(AuthScreen, { onUnlock: handleUnlock });
      }

      return React.createElement('main', { className: 'app-shell' },
        React.createElement('aside', { className: 'sidebar' },
          React.createElement('section', { className: 'brand' },
            React.createElement('p', { className: 'eyebrow' }, 'CGER Dashboard'),
            React.createElement('h1', null, 'Community Guidelines Enforcement'),
            React.createElement('p', null, 'Explore how policies are enforced globally and across regions, with an emphasis on speed, visibility, and response volume.'),
            React.createElement('div', { className: 'period-card' },
              React.createElement('span', { className: 'period-label' }, 'Reporting period'),
              React.createElement('span', { className: 'period-value' }, reportingPeriod)
            )
          ),
          React.createElement('section', { className: 'controls' },
            React.createElement('div', { className: 'control' },
              React.createElement('label', { htmlFor: 'quarter' }, 'Quarter'),
              React.createElement('select', {
                id: 'quarter',
                value: selectedQuarterId,
                onChange: e => setSelectedQuarterId(e.target.value)
              }, QUARTER_OPTIONS.map(opt => React.createElement('option', { key: opt.id, value: opt.id }, opt.label)))
            ),
            React.createElement('div', { className: 'control' },
              React.createElement('label', { htmlFor: 'region' }, 'Region'),
              React.createElement('select', {
                id: 'region',
                value: selectedRegion,
                onChange: e => setSelectedRegion(e.target.value)
              }, regionOptions.map(opt => React.createElement('option', { key: opt, value: opt }, opt)))
            ),
            React.createElement('div', { className: 'control' },
              React.createElement('label', { htmlFor: 'policy-search' }, 'Find policy'),
              React.createElement('input', {
                id: 'policy-search',
                type: 'search',
                placeholder: 'Search by policy or theme',
                value: query,
                onChange: e => setQuery(e.target.value)
              })
            )
          ),
          React.createElement('section', { className: 'policy-panel' },
            React.createElement('div', { className: 'panel-heading' },
              React.createElement('h2', null, 'Parent policies'),
              React.createElement('span', { className: 'count-pill' }, policyGroups.length)
            ),
            React.createElement('div', { className: 'policy-list' },
              policyGroups.map(group =>
                React.createElement('button', {
                  key: group.parent,
                  type: 'button',
                  className: 'policy-item parent' + (selectedParent === group.parent ? ' active' : ''),
                  onClick: () => {
                    setSelectedParent(group.parent);
                    openPolicy(group.parentPolicy || group.subPolicies[0] || group.parent, group.parent);
                  }
                },
                  React.createElement('span', null,
                    React.createElement('span', { className: 'policy-name' },
                      group.parent,
                      React.createElement('span', { className: 'subpolicy-count' }, group.subPolicies.length)
                    ),
                    React.createElement('span', { className: 'policy-category' }, group.subPolicies.length + ' sub-policies')
                  )
                )
              )
            )
          )
        ),
        React.createElement('section', { className: 'content' },
          React.createElement('div', { className: 'report-strip' },
            React.createElement('strong', null, 'Reporting period'),
            React.createElement('span', null, reportingPeriod)
          ),
          metrics ? React.createElement(React.Fragment, null,
            React.createElement('header', { className: 'topbar' },
              React.createElement('div', null,
                React.createElement('h2', null, shortPolicyName(selectedPolicy)),
                React.createElement('p', null, policyCategory(selectedPolicy) + ' performance in ' + selectedRegion + '.')
              ),
              React.createElement('div', { className: 'region-badge' }, selectedRegion)
            ),
            selectedGroup && React.createElement('section', {
              className: 'subpolicy-selector',
              ref: selectorRef,
              onMouseLeave: scheduleHidePolicyPreview,
              onMouseEnter: clearPreviewTimer
            },
              React.createElement('div', { className: 'subpolicy-selector-header' },
                React.createElement('h3', null, selectedGroup.parent),
                React.createElement('span', null, selectedGroup.subPolicies.length + ' sub-policies')
              ),
              React.createElement('div', { className: 'subpolicy-tabs' },
                selectedGroup.parentPolicy && React.createElement('button', {
                  type: 'button',
                  className: 'subpolicy-tab' + (selectedPolicy === selectedGroup.parentPolicy ? ' active' : ''),
                  onClick: e => openPolicy(selectedGroup.parentPolicy, selectedGroup.parent, e.currentTarget),
                  onMouseEnter: e => showPolicyPreview(selectedGroup.parentPolicy, selectedGroup.parent, e.currentTarget),
                  onFocus: e => showPolicyPreview(selectedGroup.parentPolicy, selectedGroup.parent, e.currentTarget),
                  onBlur: scheduleHidePolicyPreview
                },
                  React.createElement('strong', null, 'Overview'),
                  React.createElement('span', null, selectedGroup.parent)
                ),
                selectedGroup.subPolicies.map(policy =>
                  React.createElement('button', {
                    key: policy,
                    type: 'button',
                    className: 'subpolicy-tab' + (selectedPolicy === policy ? ' active' : ''),
                    onClick: e => openPolicy(policy, selectedGroup.parent, e.currentTarget),
                    onMouseEnter: e => showPolicyPreview(policy, selectedGroup.parent, e.currentTarget),
                    onFocus: e => showPolicyPreview(policy, selectedGroup.parent, e.currentTarget),
                    onBlur: scheduleHidePolicyPreview
                  },
                    React.createElement('strong', null, shortPolicyName(policy)),
                    React.createElement('span', null, 'Sub-policy')
                  )
                )
              ),
              policyPreview && React.createElement(PolicyPreview, {
                policy: policyPreview.policy,
                parent: policyPreview.parent,
                top: policyPreview.top,
                left: policyPreview.left,
                onMouseEnter: clearPreviewTimer,
                onMouseLeave: scheduleHidePolicyPreview
              })
            ),
            React.createElement('section', { className: 'metric-grid' },
              React.createElement(MetricCard, { label: 'Proactive removal', value: formatPercent(metrics.proactive_rate), detail: 'Detected before users reported it', tone: 'accent' }),
              React.createElement(MetricCard, { label: 'Within 24 hours', value: formatPercent(metrics.within_24h), detail: 'Removed within the first day' }),
              React.createElement(MetricCard, { label: 'Before views', value: formatPercent(metrics.before_views), detail: 'Removed before reaching viewers', tone: 'warning' }),
              React.createElement(MetricCard, { label: 'Comments removed', value: formatLargeNumber(metrics.comments_removed), detail: 'Removed comments in this policy area' })
            ),
            React.createElement('section', { className: 'comparison-card' },
              React.createElement('h3', null, 'Sub-policy comparison'),
              React.createElement('p', null, 'Compare every sub-policy in this parent policy by proactive removal, removal speed, and removal before views.'),
              comparisonRows.length ? React.createElement('div', { className: 'comparison-table' },
                React.createElement('div', { className: 'comparison-row header' },
                  React.createElement('div', null, ''),
                  React.createElement('div', null, 'Sub-policy'),
                  React.createElement('div', null, 'Proactive'),
                  React.createElement('div', null, 'Within 24h'),
                  React.createElement('div', null, 'Before any views')
                ),
                comparisonRows.map(row =>
                  React.createElement(ComparisonRow, {
                    key: row.policy,
                    name: shortPolicyName(row.policy),
                    metrics: row.metrics,
                    onCopy: () => handleCopySubPolicy(row)
                  })
                ),
                clipboardStatus && React.createElement('div', { className: 'comparison-clipboard-banner' }, 'Clipped to clipboard')
              ) : React.createElement('p', { className: 'card-detail' }, 'No sub-policy rows are available for this selection.')
            ),
            copyToast && React.createElement('div', { className: 'copy-toast' }, copyToast)
          ) : React.createElement('div', { className: 'empty-state' },
            React.createElement('div', null,
              React.createElement('h2', null, 'Choose a policy'),
              React.createElement('p', null, 'Select a policy from the sidebar to inspect enforcement timing and available removal metrics.')
            )
          )
        )
      );
    }

    ReactDOM.render(React.createElement(Dashboard), document.getElementById('root'));
  </script>
</body>
</html>
